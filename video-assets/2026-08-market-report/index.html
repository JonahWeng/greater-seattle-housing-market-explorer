<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#071826}
      body{font-family:Inter,Avenir Next,Arial,sans-serif;color:#f7fbff}.clip{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden}
      .frame{position:absolute;inset:0;background:#0b2436}.safe{position:absolute;inset:64px 76px 160px}.eyebrow{font-size:22px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#f3b234}
      h1,h2,p{margin:0}h1{font-size:92px;line-height:.96;letter-spacing:-.055em;max-width:1480px}h2{font-size:64px;line-height:1.02;letter-spacing:-.04em}
      .sub{font-size:30px;line-height:1.35;color:#b8c8d4}.rule{height:7px;background:#f3b234;border-radius:20px;transform-origin:left center}
      .grain{position:absolute;inset:0;opacity:.12;background-image:radial-gradient(#fff 0.7px,transparent .8px);background-size:11px 11px}
      .glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(21,151,194,.27),transparent 68%);right:-180px;top:-260px}
      .footer{position:absolute;bottom:42px;left:76px;right:76px;display:flex;justify-content:space-between;font-size:19px;color:#8ca2b2;letter-spacing:.04em}
      .hero-number{font-size:170px;line-height:.88;font-weight:900;letter-spacing:-.07em;color:#f3b234}.negative{color:#f06d45}.positive{color:#1fb5a9}
      .cards{display:flex;gap:24px}.card{background:#102f44;border:2px solid #214a62;border-radius:24px;padding:32px;min-height:210px;box-shadow:0 24px 60px rgba(0,0,0,.24)}
      .card .label{font-size:21px;letter-spacing:.08em;text-transform:uppercase;color:#8fa8ba;font-weight:800}.card .value{font-size:62px;font-weight:900;margin-top:18px;letter-spacing:-.045em}.card .delta{font-size:26px;margin-top:12px;color:#b8c8d4}
      .split{display:grid;grid-template-columns:1.18fr .82fr;gap:46px;height:100%;align-items:center}.mapbox{height:770px;border-radius:28px;overflow:hidden;border:3px solid #31566c;background:#e9eef1;position:relative}
      .mapbox img{width:100%;height:100%;object-fit:cover}.map-full img{object-position:center}.map-crop img{width:160%;height:160%;object-fit:cover;object-position:41% 52%}
      .rank-list{display:grid;gap:7px;margin-top:18px}.rank-row{display:grid;grid-template-columns:58px 1fr 130px;align-items:center;padding:9px 16px;border-radius:14px;background:#123249;border:2px solid transparent;font-size:23px;font-weight:800}
      .rank-row.hot{border-color:#f3b234;background:#173c54}.rank-row .num{font-size:20px;color:#f3b234}.rank-row .chg{text-align:right;color:#f06d45;font-size:30px}
      .city-layout{display:grid;grid-template-columns:1.07fr .93fr;gap:40px;height:100%;align-items:center}.city-map{height:760px;border-radius:28px;overflow:hidden;border:3px solid #31566c;background:#e9eef1;position:relative}
      .city-map img{width:165%;height:165%;object-fit:cover;object-position:40% 52%}.pin{position:absolute;left:53%;top:48%;width:96px;height:96px;border:8px solid #f3b234;border-radius:50%;box-shadow:0 0 0 18px rgba(243,178,52,.22)}
      .city-name{font-size:76px;font-weight:900;letter-spacing:-.055em}.city-rank{font-size:22px;color:#f3b234;font-weight:900;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}.city-layout .hero-number{font-size:118px}
      .metric-line{display:grid;grid-template-columns:1fr auto;gap:20px;padding:17px 0;border-bottom:2px solid #24485e;font-size:25px}.metric-line strong{font-size:31px}
      .takeaways{margin-top:26px;display:grid;gap:14px}.takeaway{display:grid;grid-template-columns:20px 1fr;gap:14px;font-size:25px;line-height:1.28;color:#c3d1da}.dot{width:11px;height:11px;margin-top:10px;border-radius:50%;background:#f3b234}
      .chart-layout{display:grid;grid-template-columns:1.18fr .82fr;gap:38px;height:100%;align-items:center}.chart-img{height:720px;width:100%;object-fit:contain;background:#fff;border-radius:24px;border:3px solid #31566c}
      .bar{height:20px;background:#214a62;border-radius:12px;overflow:hidden;margin-top:24px}.bar>span{display:block;height:100%;background:#f06d45;border-radius:12px;transform-origin:left center}
      .advice{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:52px}.advice-panel{border-radius:28px;padding:42px;background:#102f44;border:2px solid #31566c}.advice-panel h2{font-size:54px}.advice-panel ol{margin:28px 0 0;padding-left:32px;font-size:28px;line-height:1.5;color:#c3d1da}.advice-panel li{padding-left:10px;margin:12px 0}.safe-zone{position:absolute;left:0;right:0;bottom:0;height:160px;background:linear-gradient(transparent,rgba(2,13,22,.18));pointer-events:none}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="124" data-width="1920" data-height="1080"></div>
    <script>
      const top10=[
        {rank:10,city:'Mountlake Terrace',change:-5.6,s25:55,s26:66,p25:528,p26:498},
        {rank:9,city:'Lake Forest Park',change:-5.7,s25:54,s26:75,p25:498,p26:469},
        {rank:8,city:'Snoqualmie',change:-5.9,s25:63,s26:51,p25:500,p26:471},
        {rank:7,city:'Mercer Island',change:-6.1,s25:101,s26:95,p25:849,p26:797},
        {rank:6,city:'Issaquah',change:-6.2,s25:102,s26:115,p25:640,p26:600},
        {rank:5,city:'Redmond',change:-6.6,s25:186,s26:169,p25:746,p26:697},
        {rank:4,city:'Kenmore',change:-6.9,s25:79,s26:100,p25:542,p26:505},
        {rank:3,city:'Kirkland',change:-7.0,s25:406,s26:399,p25:768,p26:714},
        {rank:2,city:'Bellevue',change:-7.3,s25:516,s26:501,p25:771,p26:715},
        {rank:1,city:'Sammamish',change:-7.7,s25:272,s26:290,p25:650,p26:600}
      ];
      const kc=[
        {slug:'median-sales-price',title:'Median Sale Price',value:'$875K',delta:'+2.9%',note:'Price mix moved higher'},
        {slug:'average-ppsf',title:'Average Price / Sq. Ft.',value:'$515',delta:'−3.4%',note:'Underlying unit pricing softened'},
        {slug:'new-listings',title:'New Listings',value:'4,398',delta:'+22.8%',note:'More homes entered the market'},
        {slug:'homes-for-sale',title:'Homes for Sale',value:'9,062',delta:'+26.5%',note:'Buyer choice expanded quickly'},
        {slug:'closed-sales',title:'Closed Sales',value:'2,083',delta:'−12.0%',note:'Transactions slowed'},
        {slug:'average-dom',title:'Average Days on Market',value:'32 days',delta:'+14.3%',note:'Homes needed more time'},
        {slug:'months-supply-pending',title:'Months of Supply',value:'4.8 mo.',delta:'+33.3%',note:'Market balance shifted to buyers'},
        {slug:'average-percent-original-price',title:'Sale / Original List',value:'97.1%',delta:'−0.4%',note:'Negotiation became normal'}
      ];
      const deep=[
        {city:'Sammamish',rank:'Official #1',change:'−7.7%',s25:'272',s26:'290',ppsf:'$600',facts:['Top schools and environment remain strong','Commute friction matters again with return-to-office','More supply reduced the old location premium']},
        {city:'Bellevue + BRK',rank:'Eastside cluster',change:'−7.3%',s25:'516',s26:'501',ppsf:'$715',facts:['Bellevue inventory increased about 30% in May','Retirement and low-yield investment homes added supply','Buyers still want BRK—but no longer need to rush']},
        {city:'Woodinville*',rank:'Low-sample signal',change:'−10.6%',s25:'68',s26:'40',ppsf:'$531',facts:['Lifestyle premium compressed','Demand fell faster than inventory increased','Local-road commute limits the buyer pool']},
        {city:'Tukwila*',rank:'Low-sample exception',change:'−6.9%',s25:'43',s26:'63',ppsf:'$351',facts:['Small sample can move the annual comparison','Three-year price-per-square-foot remained positive','Not the same high-price Eastside adjustment story']}
      ];
      const root=document.querySelector('#root');
      const footer='<div class="footer"><span>Greater Seattle Housing Market • Aug 2026</span><span>Source: Redfin • Jan–Jun 2026 vs. Jan–Jun 2025</span></div><div class="safe-zone"></div>';
      let start=0; const add=(html,id,d=4)=>{const el=document.createElement('section');el.id=id;el.className='clip';el.dataset.start=start;el.dataset.duration=d;el.dataset.trackIndex='1';el.innerHTML=html+footer;root.appendChild(el);start+=d;return el};
      add(`<div class="frame"><div class="grain"></div><div class="glow"></div><div class="safe"><div class="eyebrow">2026 Greater Seattle Housing Market</div><h1 style="margin-top:34px">Where Did Home Prices Fall the Most?</h1><div class="rule" style="width:1040px;margin-top:44px"></div><p class="sub" style="margin-top:34px;max-width:1100px">We ranked major cities using single-family price per square foot from January through June.</p><div class="hero-number negative" style="margin-top:62px">#1 is not a suburb you would expect.</div></div></div>`,'hook');
      add(`<div class="frame"><div class="grain"></div><div class="safe"><div class="eyebrow">King County • July 2026</div><h2 style="margin-top:24px">More supply. Slower sales. More leverage.</h2><div class="cards" style="margin-top:50px"><div class="card" style="flex:1"><div class="label">Homes for sale</div><div class="value">9,062</div><div class="delta">+26.5% YoY</div></div><div class="card" style="flex:1"><div class="label">Closed sales</div><div class="value">2,083</div><div class="delta">−12.0% YoY</div></div><div class="card" style="flex:1"><div class="label">Months supply</div><div class="value">4.8</div><div class="delta">+33.3% YoY</div></div></div><div class="rule" style="width:100%;margin-top:56px"></div><p class="sub" style="margin-top:34px;font-size:36px">The direction is clear: buyers have more choice and sellers need sharper pricing.</p></div></div>`,'kc-overview');
      kc.forEach((m,i)=>add(`<div class="frame"><div class="grain"></div><div class="safe chart-layout"><div><img class="chart-img" src="assets/2026-07-king-county-monthly-${m.slug}.png"></div><div><div class="eyebrow">King County • July 2026</div><h2 style="margin-top:20px">${m.title}</h2><div class="hero-number ${m.delta.includes('−')?'negative':'positive'}" style="margin-top:46px">${m.value}</div><div style="font-size:42px;font-weight:900;margin-top:24px">${m.delta} YoY</div><div class="bar"><span style="width:${m.delta.includes('−')?'58':'82'}%"></span></div><p class="sub" style="margin-top:36px">${m.note}</p></div></div></div>`,`kc-${m.slug}`));
      add(`<div class="frame"><div class="safe split"><div class="mapbox map-full"><img src="assets/h1-ranking-map-16x9.png"></div><div><div class="eyebrow">33-city study area</div><h2 style="margin-top:18px">First-half price change</h2><div class="hero-number negative" style="font-size:118px;margin-top:38px">Eastside pressure</div><p class="sub" style="margin-top:30px">The deepest cluster is not simply the farthest-away geography. It is the group of previously high-premium markets.</p><div class="rule" style="width:100%;margin-top:42px"></div><p class="sub" style="font-size:22px;margin-top:20px">* Asterisk = fewer than 50 sales in either half-year.</p></div></div></div>`,'full-map');
      add(`<div class="frame"><div class="safe split"><div class="mapbox map-crop"><img src="assets/h1-ranking-map-16x9.png"></div><div><div class="eyebrow">Official decline ranking</div><h2 style="margin-top:16px">Top 10 • H1 2026</h2><div class="rank-list">${top10.slice().reverse().map(x=>`<div class="rank-row ${x.rank<=3?'hot':''}"><span class="num">#${x.rank}</span><span>${x.city}</span><span class="chg">${x.change.toFixed(1)}%</span></div>`).join('')}</div></div></div></div>`,'top10');
      top10.forEach(x=>add(`<div class="frame"><div class="grain"></div><div class="safe city-layout"><div class="city-map"><img data-layout-allow-overflow src="assets/h1-ranking-map-16x9.png"></div><div><div class="city-rank">Official rank #${x.rank}</div><div class="city-name">${x.city}</div><div class="hero-number negative" style="margin-top:22px">${x.change.toFixed(1)}%</div><div class="metric-line"><span>H1 2026 sales</span><strong>${x.s26}</strong></div><div class="metric-line"><span>H1 2025 sales</span><strong>${x.s25}</strong></div><div class="metric-line"><span>2026 price / sq. ft.</span><strong>$${x.p26}</strong></div><div class="metric-line"><span>2025 price / sq. ft.</span><strong>$${x.p25}</strong></div></div></div></div>`,`city-${x.rank}`));
      deep.forEach((x,i)=>add(`<div class="frame"><div class="grain"></div><div class="safe city-layout"><div><div class="city-rank">${x.rank}</div><div class="city-name">${x.city}</div><div class="hero-number negative" style="margin-top:28px">${x.change}</div><div class="cards" style="margin-top:38px"><div class="card" style="flex:1;min-height:150px"><div class="label">H1 2025 sales</div><div class="value" style="font-size:48px">${x.s25}</div></div><div class="card" style="flex:1;min-height:150px"><div class="label">H1 2026 sales</div><div class="value" style="font-size:48px">${x.s26}</div></div><div class="card" style="flex:1;min-height:150px"><div class="label">2026 PPSF</div><div class="value" style="font-size:48px">${x.ppsf}</div></div></div></div><div><div class="eyebrow">What the data suggests</div><div class="takeaways" style="margin-top:32px">${x.facts.map(f=>`<div class="takeaway"><span class="dot"></span><span>${f}</span></div>`).join('')}</div><div class="rule" style="width:100%;margin-top:42px"></div><p class="sub" style="font-size:22px;margin-top:22px">Observation, not a causal proof. Confirm at neighborhood and property level.</p></div></div></div>`,`deep-${i}`));
      ['1y','3y','5y'].forEach((yr,i)=>add(`<div class="frame"><div class="safe chart-layout"><img class="chart-img" src="assets/2026_sfr_ppsf_${yr}_main_40_cities_A4.png"><div><div class="eyebrow">Long-term validation</div><h2 style="margin-top:20px">${yr.replace('y','-year')} price / sq. ft.</h2><div class="hero-number ${yr==='1y'?'negative':'positive'}" style="font-size:110px;margin-top:42px">${yr==='1y'?'Correction':'Perspective'}</div><p class="sub" style="margin-top:34px">${yr==='3y'?'The Eastside pullback is largely consuming gains from the prior run-up.':'One window never tells the whole story.'}</p><div class="rule" style="width:100%;margin-top:42px"></div><p class="sub" style="font-size:22px;margin-top:20px">Use the three-year view as the main spoken validation.</p></div></div></div>`,`long-${yr}`));
      add(`<div class="frame"><div class="grain"></div><div class="safe"><div class="eyebrow">Decision framework</div><h2 style="margin-top:20px">What should buyers and sellers do now?</h2><div class="advice"><div class="advice-panel"><div class="eyebrow">For buyers</div><h2 style="margin-top:14px">Buy for your life radius</h2><ol><li>Start with commute and daily needs.</li><li>Favor entry-level single-family homes with a broad resale pool.</li><li>Use current inventory to negotiate—without trying to time the exact bottom.</li></ol></div><div class="advice-panel"><div class="eyebrow">For sellers</div><h2 style="margin-top:14px">Price for today</h2><ol><li>Compare the latest 30–60 days, not peak-era comps.</li><li>Measure after-tax proceeds and net rental return.</li><li>Adjust quickly if the first two weeks are quiet.</li></ol></div></div></div></div>`,'advice');
      add(`<div class="frame"><div class="grain"></div><div class="glow"></div><div class="safe"><div class="eyebrow">Free interactive map</div><h1 style="margin-top:34px">Explore every city.<br>Compare 1, 3 and 5 years.</h1><div class="rule" style="width:1160px;margin-top:44px"></div><div class="hero-number" style="font-size:104px;margin-top:66px">Comment “MAP”</div><p class="sub" style="margin-top:32px">Get the full Greater Seattle Housing Market Explorer from the pinned link.</p></div></div>`,'cta');
      window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});
      document.querySelectorAll('.clip').forEach(el=>{const s=Number(el.dataset.start);const d=Number(el.dataset.duration);const inner=el.querySelector('.frame');const heads=el.querySelectorAll('h1,h2,.hero-number,.city-name');const items=el.querySelectorAll('.card,.rank-row,.metric-line,.takeaway');const rules=el.querySelectorAll('.rule,.bar>span');tl.fromTo(inner,{autoAlpha:0},{autoAlpha:1,duration:.38,ease:'power2.out'},s);if(heads.length)tl.fromTo(heads,{y:42,opacity:0},{y:0,opacity:1,duration:.72,stagger:.06,ease:'power3.out'},s+.12);if(items.length)tl.fromTo(items,{x:34,opacity:0},{x:0,opacity:1,duration:.54,stagger:.055,ease:'power2.out'},s+.3);if(rules.length)tl.fromTo(rules,{scaleX:0},{scaleX:1,duration:.7,ease:'power3.out'},s+.28);tl.to(inner,{autoAlpha:0,duration:.25,ease:'power2.in'},s+d-.25)});
      window.__timelines.main=tl;
    </script>
  </body>
</html>
